  学校年度体检，外科要求脱上衣。
  <br/>
  医生掀起我衣服看了一眼背，啧了一声：「小伙子，你前两天在哪刮的痧？师傅也太业余了。这手法......跟用鞭子抽的有什么区别？」
  <br/>
  我僵在原地没敢接话。
  <br/>
  刚穿好衣服准备溜，背后又传来一句冷冰冰的嘱咐：
  <br/>
  「行了。走之前把你脖子上的创可贴贴好，都翻边了。」
