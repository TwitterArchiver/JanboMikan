  半夜黑灯瞎火，推油急吼吼地把我按在电竞椅上。
  <br/>
  我想起抽屉里还有支没用完的润滑，顺手摸出来拧开就往里挤。
  <br/>
  刚起身就感觉不对，下半身传来一阵诡异的干冷。
  <br/>

  <br/>
  「你哪来的信越7868？？」
