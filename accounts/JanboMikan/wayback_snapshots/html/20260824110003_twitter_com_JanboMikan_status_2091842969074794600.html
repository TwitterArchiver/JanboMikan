  凌晨大巴停靠服务区，睡得迷迷糊糊就顺着人流进了男厕。
  <br/>
  闭着眼站在小便池前飞速放完水，转头一看，同车那个极其严肃的老大爷正震惊地盯着我的下半身。
  <br/>
  目光在我的蕾丝裙摆和手中那根尚未收回的物件之间来回扫了三遍。
  <br/>
  大爷长叹一口气，走到洗手池前拍了拍脑门：「这长途坐得，都他妈出现幻觉了。」
