  在教室上课，总感觉大腿一阵温热黏腻。
  <br/>
  往口袋里一摸才发现是之前别人送的纸包白巧克力忘拿出来了。
  <br/>
  再低头一看，坏了，乳白色的黏稠液体正顺着裤管边缘滴滴答答地往下淌，在地上留下一大滩。
  <br/>
  浑身一僵。
  <br/>
  紧接着，就听到后座传来一声极力压抑气音：
  <br/>
  「玩挺大。」
